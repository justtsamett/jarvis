<script>
    async function handle() {
        const val = textInput.value.trim();
        if (!val) return;
        
        addMsg(val, 'user');
        textInput.value = "";

        // --- KARAR MEKANİZMASI (Süzgeç) ---
        // Kullanıcı bu kelimelerden birini kullandıysa ASLA Groq'a gitme!
        const resimKomutlari = ["çiz", "oluştur", "yap", "resim", "görsel", "fotoğraf", "draw", "create", "image", "generate"];
        const isImageRequest = resimKomutlari.some(komut => val.toLowerCase().includes(komut));

        if (isImageRequest) {
            // 1. ADIM: Groq'u devre dışı bırak, resim motorunu başlat
            addMsg("Anlaşıldı Samet bey, görsel motorunu ateşliyorum...", "ai");
            speak("Hemen çiziyorum.");
            
            // Komut kelimelerini temizle ki prompt saf kalsın
            const prompt = val.replace(/(çiz|oluştur|yap|bana|resim|görsel|bir|tane|fotoğraf)/gi, "").trim();
            const seed = Math.floor(Math.random() * 999999);
            
            // 2. ADIM: Pollinations'ın DIRECT IMAGE linkini oluştur
            const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=1024&height=1024&seed=${seed}&nologo=true`;

            // 3. ADIM: Resmi zorla ekrana bastır
            const img = new Image();
            img.src = imageUrl;
            img.onload = () => {
                addMsg(imageUrl, "ai", true);
                speak("Görseliniz hazır efendim.");
            };
            img.onerror = () => {
                addMsg("Görsel sunucusu şu an yanıt vermiyor, tekrar deneyelim mi?", "ai");
            };

        } else {
            // 4. ADIM: Sadece resim kelimesi YOKSA Groq'a git
            try {
                const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { 
                        "Authorization": "Bearer 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", 
                        "Content-Type": "application/json" 
                    },
                    body: JSON.stringify({ 
                        model: "llama-3.3-70b-versatile", 
                        messages: [{role:"system", content:"Sen Jarvis'sin. Çok kısa ve öz cevap ver."}, {role:"user", content:val}] 
                    })
                });
                const data = await res.json();
                const reply = data.choices[0].message.content;
                addMsg(reply, "ai");
                speak(reply);
            } catch(e) { 
                addMsg("Sohbet motoru şu an meşgul.", "ai"); 
            }
        }
    }
</script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. Alpha</title>
    <style>
        body { background: #050505; color: #00d4ff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        .circle { width: 250px; height: 250px; border: 4px solid #00d4ff; border-radius: 50%; box-shadow: 0 0 50px #00d4ff, inset 0 0 20px #00d4ff; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; animation: pulse 2s infinite; position: relative; }
        .circle:active { transform: scale(0.9); }
        .circle h2 { font-size: 1.5rem; letter-spacing: 5px; text-shadow: 0 0 10px #00d4ff; }
        #status { margin-top: 30px; font-size: 1rem; text-transform: uppercase; letter-spacing: 2px; text-align: center; width: 80%; color: #00d4ff; opacity: 0.8; }
        @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 50px #00d4ff; } 50% { transform: scale(1.05); box-shadow: 0 0 80px #00d4ff; } 100% { transform: scale(1); box-shadow: 0 0 50px #00d4ff; } }
    </style>
</head>
<body>
    <div class="circle" id="core"><h2>J.A.R.V.I.S.</h2></div>
    <div id="status">TAP TO WAKE UP SYSTEMS, SIR</div>

    <script>
        const status = document.getElementById('status');
        const core = document.getElementById('core');
        
        // ElevenLabs Ayarları (Ses karizmatik kalsın)
        const ELEVEN_KEY = "sk_c570b06ce12fc5dc0e6965a590763b5984e0e86a7462099a";
        const VOICE_ID = "JBFqnCBsd6RMkjVDRZzb";

        // Ses Tanıma Ayarları (SADECE İNGİLİZCE)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US'; // Sadece İngilizce dinleyecek
        recognition.continuous = false;

        async function speak(text) {
            status.innerText = "J.A.R.V.I.S. IS RESPONDING...";
            try {
                const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${VOICE_ID}`, {
                    method: 'POST',
                    headers: { 'xi-api-key': ELEVEN_KEY, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        text: text, 
                        model_id: "eleven_multilingual_v2",
                        voice_settings: { stability: 0.5, similarity_boost: 0.75 }
                    })
                });
                const blob = await response.blob();
                const audio = new Audio(URL.createObjectURL(blob));
                await audio.play();
                audio.onended = () => { status.innerText = "LISTENING, SIR..."; recognition.start(); };
            } catch (e) { 
                status.innerText = "AUDIO CORE ERROR"; 
            }
        }

        core.onclick = () => {
            recognition.start();
            status.innerText = "LISTENING, SIR...";
        };

        recognition.onresult = async (event) => {
            const userText = event.results[0][0].transcript;
            status.innerText = "ANALYZING: " + userText;
            
            try {
                const response = await fetch("/api/ask", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ text: userText })
                });
                
                const data = await response.json();
                if (data.answer) {
                    await speak(data.answer);
                } else {
                    status.innerText = "CORE CONNECTION FAILED";
                }
            } catch (error) { 
                status.innerText = "SYSTEM ERROR: " + error.message;
            }
        };

        recognition.onerror = (event) => {
            status.innerText = "MIC ERROR: " + event.error;
        };
    </script>
</body>
</html>

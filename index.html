<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dot v64.0 - Samet'in Asistanı</title>
    <style>
        :root { --bg: #000; --accent: #00f2ff; --text: #00f2ff; --msg-ai: #111; --header: #000; }
        .light-mode { --bg: #f0f2f5; --accent: #007bff; --text: #212529; --msg-ai: #fff; --header: #fff; }
        
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; font-family: 'Segoe UI', sans-serif; transition: 0.3s; }
        
        #header { position: fixed; top: 0; width: 100%; height: 60px; border-bottom: 1px solid var(--accent); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100; background: var(--header); }
        
        #chat { position: absolute; top: 60px; bottom: 85px; left: 0; width: 100%; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; padding-bottom: 150px; }
        
        .msg { padding: 14px 18px; border-radius: 20px; max-width: 85%; font-size: 15px; border: 1px solid rgba(0,0,0,0.1); }
        .user { align-self: flex-end; background: var(--accent); color: #000; font-weight: bold; border-bottom-right-radius: 4px; }
        .ai { align-self: flex-start; background: var(--msg-ai); border: 1px solid #333; border-bottom-left-radius: 4px; }
        .ai-img { width: 100%; border-radius: 12px; margin-top: 10px; border: 1px solid var(--accent); }

        /* Terminal Stili */
        #terminal { display: none; position: fixed; top: 70px; right: 20px; width: 300px; height: 400px; background: rgba(0,0,0,0.9); border: 1px solid red; color: #0f0; font-family: monospace; font-size: 12px; padding: 10px; overflow-y: auto; z-index: 2000; border-radius: 8px; box-shadow: 0 0 20px rgba(255,0,0,0.3); }

        #controls { position: fixed; bottom: 0; width: 100%; height: 85px; background: var(--header); border-top: 1px solid #333; display: flex; align-items: center; padding: 0 15px; z-index: 1000; }
        #inputBar { display: flex; gap: 10px; width: 100%; max-width: 1100px; margin: 0 auto; align-items: center; }
        #textInput { flex: 1; height: 50px; background: rgba(128,128,128,0.1); border: 1px solid var(--accent); border-radius: 25px; padding: 0 20px; color: var(--text); outline: none; }
        
        .iconBtn { background: var(--accent); border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; color: #000; font-size: 20px; display: flex; align-items: center; justify-content: center; }
        .termBtn { background: #333; color: red; border: 1px solid red; }
    </style>
</head>
<body>

<div id="header">
    <div style="font-weight:bold;">DOT <span style="font-size:12px; opacity:0.6;">v64</span></div>
    <div>
        <button onclick="document.body.classList.toggle('light-mode')" class="iconBtn" style="display:inline-flex; width:auto; padding:0 10px; border-radius:15px; font-size:14px;">🌓 TEMA</button>
        <button onclick="toggleTerminal()" class="iconBtn termBtn" style="display:inline-flex; width:auto; padding:0 10px; border-radius:15px; font-size:14px; margin-left:5px;">📟 TERM</button>
    </div>
</div>

<div id="terminal" id="termLogs"><b>--- DOT SYSTEM LOGS ---</b><br></div>
<div id="chat"></div>

<div id="controls">
    <div id="inputBar">
        <button id="micBtn" class="iconBtn">🎤</button>
        <input type="text" id="textInput" placeholder="Dot ile konuşun..." autocomplete="off">
        <button id="sendBtn" class="iconBtn">🚀</button>
    </div>
</div>

<script>
    const chat = document.getElementById('chat');
    const textInput = document.getElementById('textInput');
    const terminal = document.getElementById('terminal');
    
    function log(msg, type="INFO") {
        const time = new Date().toLocaleTimeString();
        terminal.innerHTML += `[${time}] [${type}] ${msg}<br>`;
        terminal.scrollTop = terminal.scrollHeight;
    }

    function toggleTerminal() {
        terminal.style.display = terminal.style.display === 'none' ? 'block' : 'none';
    }

    function speak(t) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(t); u.lang = 'tr-TR';
        window.speechSynthesis.speak(u);
    }

    function addMsg(content, type, isImage = false) {
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.innerHTML = isImage ? `<img src="${content}" class="ai-img" onload="chat.scrollTop = chat.scrollHeight">` : content;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    async function handle() {
        const val = textInput.value.trim();
        if (!val) return;
        addMsg(val, 'user');
        textInput.value = "";
        log(`User input: ${val}`);

        const isImg = ["çiz", "oluştur", "yap", "resim", "görsel"].some(k => val.toLowerCase().includes(k));

        if (isImg) {
            log("Image generation triggered", "PROCESS");
            addMsg("Hemen hazırlıyorum Samet.", "ai");
            const p = val.replace(/(çiz|oluştur|yap|bana|resim|görsel)/gi, "").trim();
            const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(p)}?width=1024&height=1024&nologo=true&seed=${Math.random()}`;
            
            const img = new Image();
            img.src = url;
            img.onload = () => { addMsg(url, "ai", true); log("Image loaded successfully"); };
            img.onerror = () => { log("Image Load Failed", "ERROR"); addMsg("Görsel motoru hata verdi.", "ai"); };
        } else {
            log("Groq API request sent", "API");
            try {
                const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": "Bearer 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", "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        model: "llama-3.3-70b-versatile", 
                        messages: [{role:"system", content:"Sen Dot'sın. Samet'in (16, lise öğrencisi) şahsi yapay zekasısın. Onu iyi tanıyorsun. Kısa ve zekice konuş."}, {role:"user", content:val}] 
                    })
                });
                const data = await res.json();
                const reply = data.choices[0].message.content;
                addMsg(reply, "ai");
                speak(reply);
                log("Response received from Groq");
            } catch(e) { 
                log(e.message, "ERROR");
                addMsg("Bağlantı koptu.", "ai"); 
            }
        }
    }

    document.getElementById('sendBtn').onclick = handle;
    textInput.onkeypress = (e) => { if(e.key === 'Enter') handle(); };
    document.getElementById('micBtn').onclick = () => {
        log("Mic activated", "SYSTEM");
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        const rec = new SR(); rec.lang = 'tr-TR';
        rec.onresult = (e) => { textInput.value = e.results[0][0].transcript; handle(); };
        rec.start();
    };

    window.onload = () => {
        log("Dot OS 64.0 Initialized");
        addMsg("Sistem çevrimiçi Samet. Dot göreve hazır.", "ai");
    };
</script>
</body>
</html>

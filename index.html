<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>J.A.R.V.I.S. Alpha</title>
    <style>
        body { background: #050505; color: #00d4ff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .circle { width: 250px; height: 250px; border: 4px solid #00d4ff; border-radius: 50%; box-shadow: 0 0 50px #00d4ff; display: flex; align-items: center; justify-content: center; cursor: pointer; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        #status { margin-top: 30px; font-size: 1rem; letter-spacing: 2px; text-align: center; }
    </style>
</head>
<body>
    <div class="circle" id="core"><h2>J.A.R.V.I.S.</h2></div>
    <div id="status">WAKE UP THE SYSTEMS, SIR</div>

    <script>
        const status = document.getElementById('status');
        const core = document.getElementById('core');
        const ELEVEN_KEY = "sk_c570b06ce12fc5dc0e6965a590763b5984e0e86a7462099a";
        const VOICE_ID = "JBFqnCBsd6RMkjVDRZzb";

        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'en-US';

        async function speak(text) {
            // WhatsApp Tetikleyici
            if (text.includes("[ACTION:OPEN_WHATSAPP]")) {
                text = text.replace("[ACTION:OPEN_WHATSAPP]", "");
                window.location.href = "whatsapp://";
            }

            status.innerText = "J.A.R.V.I.S. SPEAKING...";
            const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${VOICE_ID}`, {
                method: 'POST',
                headers: { 'xi-api-key': ELEVEN_KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text, model_id: "eleven_multilingual_v2" })
            });
            const blob = await response.blob();
            const audio = new Audio(URL.createObjectURL(blob));
            audio.play();
            audio.onended = () => { status.innerText = "LISTENING, SIR..."; recognition.start(); };
        }

        core.onclick = () => { recognition.start(); status.innerText = "LISTENING, SIR..."; };

        recognition.onresult = async (event) => {
            const userText = event.results[0][0].transcript;
            status.innerText = "PROCESSING...";
            try {
                const response = await fetch("/api/ask", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ text: userText })
                });
                const data = await response.json();
                await speak(data.answer);
            } catch (error) { status.innerText = "CONNECTION ERROR"; }
        };
    </script>
</body>
</html>

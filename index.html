<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>J.A.R.V.I.S. Core V6</title>
    <style>
        body { background: #050505; color: #00d4ff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .circle { width: 250px; height: 250px; border: 5px solid #00d4ff; border-radius: 50%; box-shadow: 0 0 50px #00d4ff; display: flex; align-items: center; justify-content: center; cursor: pointer; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        #status { margin-top: 25px; font-size: 1.1em; text-align: center; color: #00d4ff; text-shadow: 0 0 10px #00d4ff; }
    </style>
</head>
<body>
    <div class="circle" id="core"><h2>J.A.R.V.I.S.</h2></div>
    <div id="status">SİSTEMİ UYANDIRMAK İÇİN DAİREYE DOKUNUN</div>

    <script type="module">
        import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

        // Senin güncel anahtarların
        const API_KEY = "AIzaSyA520ougNutYRwG_R96VI8QGCwItl1UeZk"; 
        const ELEVEN_KEY = "sk_c570b06ce12fc5dc0e6965a590763b5984e0e86a7462099a";
        const VOICE_ID = "JBFqnCBsd6RMkjVDRZzb";

        const genAI = new GoogleGenerativeAI(API_KEY);
        const status = document.getElementById('status');
        const core = document.getElementById('core');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'tr-TR';

        async function speak(text) {
            status.innerText = "CEVAP VERİLİYOR...";
            try {
                const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${VOICE_ID}`, {
                    method: 'POST',
                    headers: { 'xi-api-key': ELEVEN_KEY, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text, model_id: "eleven_multilingual_v2" })
                });
                const blob = await response.blob();
                const audio = new Audio(URL.createObjectURL(blob));
                await audio.play();
                audio.onended = () => { status.innerText = "DİNLENİYOR..."; };
            } catch (e) { status.innerText = "SES HATASI: " + e.message; }
        }

        core.onclick = () => {
            recognition.start();
            status.innerText = "SİZİ DİNLİYORUM EFENDİM...";
        };

        recognition.onresult = async (event) => {
            const userText = event.results[0][0].transcript;
            status.innerText = "DÜŞÜNÜLÜYOR: " + userText;
            
            try {
                // MODELİ "gemini-1.5-flash" OLARAK SABİTLEDİK
                const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });
                const result = await model.generateContent(userText);
                const response = await result.response;
                const text = response.text();
                
                await speak(text);
            } catch (error) { 
                console.error(error);
                status.innerText = "ZEKA HATASI: " + error.message;
            }
        };
    </script>
</body>
</html>

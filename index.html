<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Jarvis v53.0 - Samet Sevgi</title>
    <style>
        :root { --bg: #000; --accent: #00f2ff; --text: #00f2ff; --msg-ai: #111; }
        .light-mode { --bg: #f8f9fa; --accent: #007bff; --text: #212529; --msg-ai: #e9ecef; }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: sans-serif; overflow: hidden; }

        #header { 
            position: fixed; top: 0; left: 0; width: 100%; height: 60px;
            display: flex; justify-content: space-between; align-items: center; 
            padding: 0 20px; border-bottom: 1px solid var(--accent);
            background: var(--bg); z-index: 1000;
        }

        #chat { 
            position: absolute; top: 60px; bottom: 80px; left: 0; width: 100%;
            overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px;
            padding-bottom: 120px;
        }
        
        .msg { padding: 14px 18px; border-radius: 20px; max-width: 85%; font-size: 15px; }
        .user { align-self: flex-end; background: var(--accent); color: #000; font-weight: bold; }
        .ai { align-self: flex-start; background: var(--msg-ai); border: 1px solid rgba(128,128,128,0.2); }

        .image-container { margin-top: 10px; border: 2px solid var(--accent); border-radius: 12px; overflow: hidden; background: #000; }
        .ai-img { width: 100%; height: auto; display: block; }

        #controls { 
            position: fixed; bottom: 0; left: 0; width: 100%; height: 80px;
            background: var(--bg); border-top: 1px solid rgba(128,128,128,0.3);
            display: flex; align-items: center; padding: 0 15px; z-index: 1000;
        }

        #inputBar { display: flex; gap: 10px; align-items: center; width: 100%; max-width: 1100px; margin: 0 auto; }
        #textInput { flex: 1; height: 50px; background: rgba(128,128,128,0.15); border: 1px solid var(--accent); border-radius: 25px; padding: 0 20px; color: var(--text); outline: none; font-size: 16px; }
        .iconBtn { background: var(--accent); border: none; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #000; }
    </style>
</head>
<body onclick="activateAudio()"> <div id="header">
    <div style="font-weight: bold;">SAMET SEVGİ | JARVIS</div>
    <button onclick="document.body.classList.toggle('light-mode')" style="background:none; border:1px solid var(--accent); color:var(--accent); border-radius:15px; padding:5px 10px;">🌓 TEMA</button>
</div>

<div id="chat"></div>

<div id="controls">
    <div id="inputBar">
        <button id="micBtn" class="iconBtn">🎤</button>
        <input type="text" id="textInput" placeholder="Yazın veya konuşun..." autocomplete="off">
        <button id="sendBtn" class="iconBtn">🚀</button>
    </div>
</div>

<script>
    const chat = document.getElementById('chat');
    const textInput = document.getElementById('textInput');
    const sendBtn = document.getElementById('sendBtn');
    let audioActivated = false;

    // Ses motorunu aktifleştirme (Kullanıcı etkileşimi şart)
    function activateAudio() {
        if (!audioActivated) {
            const synth = window.speechSynthesis;
            const utter = new SpeechSynthesisUtterance("");
            synth.speak(utter);
            audioActivated = true;
            console.log("Ses motoru hazır.");
        }
    }

    function speak(text) {
        if (!text) return;
        window.speechSynthesis.cancel(); // Önceki sesi sustur
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'tr-TR';
        utter.rate = 1.0;
        utter.pitch = 1.0;
        window.speechSynthesis.speak(utter);
    }

    function addMsg(text, type, isImg = false) {
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        if(isImg) {
            div.innerHTML = `<div class="image-container"><img src="${text}" class="ai-img" onload="chat.scrollTop = chat.scrollHeight"></div>`;
        } else {
            div.innerText = text;
        }
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    async function handle() {
        const val = textInput.value.trim();
        if(!val) return;
        addMsg(val, 'user');
        textInput.value = "";

        if(val.toLowerCase().includes("çiz") || val.toLowerCase().includes("oluştur")) {
            const reply = "Hemen çiziyorum Samet bey.";
            addMsg(reply, "ai");
            speak(reply);
            const seed = Math.floor(Math.random() * 1000000);
            const url = `https://pollinations.ai/p/${encodeURIComponent(val)}?width=1024&height=1024&seed=${seed}&nologo=true`;
            setTimeout(() => addMsg(url, "ai", true), 1000);
        } else {
            try {
                const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": "Bearer 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", "Content-Type": "application/json" },
                    body: JSON.stringify({ model: "llama-3.3-70b-versatile", messages: [{role:"system", content:"Sen Jarvis'sin. Çok kısa cevap ver."}, {role:"user", content:val}] })
                });
                const data = await res.json();
                const reply = data.choices[0].message.content;
                addMsg(reply, 'ai');
                speak(reply); // YANITI SESLİ OKU
            } catch(e) { 
                addMsg("Hata oluştu.", "ai"); 
            }
        }
    }

    sendBtn.onclick = handle;
    textInput.onkeypress = (e) => { if(e.key === 'Enter') handle(); };
    
    document.getElementById('micBtn').onclick = () => {
        activateAudio(); // Mikrofona basınca ses motorunu da aç
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        const rec = new SR(); rec.lang = 'tr-TR';
        rec.onresult = (e) => { textInput.value = e.results[0][0].transcript; handle(); };
        rec.start();
    };

    window.onload = () => {
        addMsg("Sistem çevrimiçi Samet bey. Sesli yanıtları duymak için ekrana bir kez dokunun.", "ai");
    };
</script>
</body>
</html>

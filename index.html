<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jarvis v43.7 - Samet Sevgi</title>
    <style>
        :root { --bg: #000; --accent: #00f2ff; --chat-bg: #080808; --text: #00f2ff; --msg-ai: #111; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #header { padding: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--accent); background: rgba(0,0,0,0.5); }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 12px; border-radius: 12px; max-width: 80%; font-size: 14px; border: 1px solid #00f2ff22; }
        .user { align-self: flex-end; background: var(--accent); color: #000; }
        .ai { align-self: flex-start; background: var(--msg-ai); }
        #controls { background: var(--chat-bg); padding: 15px; border-top: 1px solid #222; position: relative; }
        #status { position: absolute; top: -25px; left: 0; width: 100%; text-align: center; font-size: 10px; color: var(--accent); letter-spacing: 1px; }
        #inputBar { display: flex; gap: 10px; align-items: center; }
        #textInput { flex: 1; background: #151515; border: 1px solid #333; border-radius: 20px; padding: 10px 15px; color: #fff; outline: none; }
        .iconBtn { background: var(--accent); border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        #micBtn.active { background: #ff0044; box-shadow: 0 0 15px #ff0044; animation: pulse 1s infinite; }
        @keyframes pulse { 0% {transform: scale(1);} 50% {transform: scale(1.1);} 100% {transform: scale(1);} }
    </style>
</head>
<body>

<div id="header">
    <div style="font-size: 10px;">DESIGNED BY <b>SAMET SEVGİ</b></div>
    <button onclick="location.reload()" style="background:none; border:1px solid #555; color:#555; font-size:10px; padding:2px 5px;">YENİLE</button>
</div>

<div id="chat"></div>

<div id="controls">
    <div id="status">SİSTEM UYKUDA (AKTİFLEŞTİRMEK İÇİN EKRANA DOKUNUN)</div>
    <div id="inputBar">
        <button id="micBtn" class="iconBtn">🎤</button>
        <input type="text" id="textInput" placeholder="Samet Bey..." autocomplete="off">
        <button id="sendBtn" class="iconBtn">🚀</button>
    </div>
</div>

<script>
    const chat = document.getElementById('chat');
    const textInput = document.getElementById('textInput');
    const micBtn = document.getElementById('micBtn');
    const status = document.getElementById('status');
    
    let recognition, wakeWordRec, isRecording = false, wakeActive = false;

    // --- SESLİ YANIT ---
    function speak(t) {
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(t);
        m.lang = 'tr-TR';
        window.speechSynthesis.speak(m);
    }

    // --- ANA KAYIT MOTORU ---
    function startMainRecording() {
        if (isRecording) return;
        isRecording = true;
        if(wakeWordRec) wakeWordRec.stop(); // Tetikleyiciyi sustur

        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SR();
        recognition.lang = 'tr-TR';
        recognition.interimResults = true;

        micBtn.classList.add('active');
        status.innerText = "🔴 SİZİ DİNLİYORUM...";

        recognition.onresult = (e) => {
            textInput.value = Array.from(e.results).map(r => r[0].transcript).join('');
        };

        recognition.onend = () => {
            isRecording = false;
            micBtn.classList.remove('active');
            if (textInput.value.trim()) send();
            status.innerText = "📡 HEY JARVIS DEMENİZİ BEKLİYORUM...";
            startWakeWord(); // Tekrar dinlemeye dön
        };
        recognition.start();
    }

    // --- HEY JARVIS (WAKE WORD) MOTORU ---
    function startWakeWord() {
        if (isRecording) return;
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        wakeWordRec = new SR();
        wakeWordRec.lang = 'tr-TR';
        wakeWordRec.continuous = true;
        wakeWordRec.interimResults = true;

        wakeWordRec.onresult = (e) => {
            const transcript = Array.from(e.results).map(r => r[0].transcript).join('').toLowerCase();
            if (transcript.includes("jarvis") || transcript.includes("servis") || transcript.includes("hey")) {
                wakeWordRec.stop();
                speak("Efendim Samet?");
                setTimeout(startMainRecording, 1000);
            }
        };

        wakeWordRec.onend = () => { if(!isRecording) wakeWordRec.start(); };
        wakeWordRec.start();
        wakeActive = true;
        status.innerText = "📡 HEY JARVIS DEMENİZİ BEKLİYORUM...";
    }

    // --- API GÖNDERİM ---
    async function send() {
        const txt = textInput.value.trim();
        if(!txt) return;
        addMsg(txt, 'user');
        textInput.value = "";
        try {
            const r = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": "Bearer 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", "Content-Type": "application/json" },
                body: JSON.stringify({ model: "llama-3.3-70b-versatile", messages: [{role:"system", content:"Sen Samet Sevgi'nin Jarvis'isin. Kısa cevap ver."}, {role:"user", content:txt}] })
            });
            const d = await r.json();
            const reply = d.choices[0].message.content;
            addMsg(reply, 'ai');
            speak(reply);
        } catch(e) { addMsg("Bağlantı hatası.", "ai"); }
    }

    function addMsg(t, type) {
        const d = document.createElement('div');
        d.className = `msg ${type}`;
        d.innerText = t;
        chat.appendChild(d);
        chat.scrollTop = chat.scrollHeight;
    }

    // EKRANA İLK DOKUNUŞTA SİSTEMİ BAŞLAT
    document.body.onclick = () => {
        if (!wakeActive) {
            startWakeWord();
            speak("Sistem aktif Samet bey.");
        }
    };

    micBtn.onclick = startMainRecording;
    document.getElementById('sendBtn').onclick = send;
</script>
</body>
</html>

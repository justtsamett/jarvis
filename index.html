<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Jarvis v63.0 - Samet Sevgi</title>
    <style>
        :root { --bg: #000; --accent: #00f2ff; --text: #00f2ff; --msg-ai: #111; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; font-family: sans-serif; }
        #header { position: fixed; top: 0; width: 100%; height: 60px; border-bottom: 1px solid var(--accent); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100; background: #000; }
        #chat { position: absolute; top: 60px; bottom: 85px; left: 0; width: 100%; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; padding-bottom: 150px; }
        .msg { padding: 14px 18px; border-radius: 20px; max-width: 85%; font-size: 15px; line-height: 1.4; }
        .user { align-self: flex-end; background: var(--accent); color: #000; font-weight: bold; border-bottom-right-radius: 4px; }
        .ai { align-self: flex-start; background: var(--msg-ai); border: 1px solid #222; border-bottom-left-radius: 4px; }
        .ai-img { width: 100%; border-radius: 12px; margin-top: 10px; border: 1px solid var(--accent); display: block; background: #050505; }
        #controls { position: fixed; bottom: 0; width: 100%; height: 85px; background: #0a0a0a; border-top: 1px solid #222; display: flex; align-items: center; padding: 0 15px; z-index: 1000; }
        #inputBar { display: flex; gap: 10px; width: 100%; max-width: 1100px; margin: 0 auto; align-items: center; }
        #textInput { flex: 1; height: 50px; background: #1a1a1a; border: 1px solid #333; border-radius: 25px; padding: 0 20px; color: #fff; outline: none; font-size: 16px; }
        .iconBtn { background: var(--accent); border: none; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; color: #000; font-size: 22px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    </style>
</head>
<body>

<div id="header">
    <div style="font-weight:bold;">SAMET SEVGİ | JARVIS</div>
    <div style="font-size:10px; color:var(--accent);">v63.0 FIXED</div>
</div>

<div id="chat"></div>

<div id="controls">
    <div id="inputBar">
        <button id="micBtn" class="iconBtn">🎤</button>
        <input type="text" id="textInput" placeholder="Mesajınızı buraya yazın..." autocomplete="off">
        <button id="sendBtn" class="iconBtn">🚀</button>
    </div>
</div>

<script>
    const chat = document.getElementById('chat');
    const textInput = document.getElementById('textInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');

    function speak(t) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(t);
        u.lang = 'tr-TR';
        window.speechSynthesis.speak(u);
    }

    function addMsg(content, type, isImage = false) {
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        if (isImage) {
            div.innerHTML = `<div>Görsel hazır Samet bey:</div><img src="${content}" class="ai-img" onload="chat.scrollTop = chat.scrollHeight">`;
        } else {
            div.innerText = content;
        }
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    async function handle() {
        const val = textInput.value.trim();
        if (!val) return;
        
        addMsg(val, 'user');
        textInput.value = "";

        // Senin dediğin gibi: Önce resim mi diye bakıyoruz
        const resimKelime = ["çiz", "oluştur", "yap", "resim", "görsel", "draw", "image"];
        const isImage = resimKelime.some(k => val.toLowerCase().includes(k));

        if (isImage) {
            addMsg("Hemen çiziyorum Samet bey...", "ai");
            speak("Hemen çiziyorum.");
            
            const p = val.replace(/(çiz|oluştur|yap|bana|resim|görsel)/gi, "").trim();
            const seed = Math.floor(Math.random() * 999999);
            const imageUrl = "https://image.pollinations.ai/prompt/" + encodeURIComponent(p) + "?width=1024&height=1024&seed=" + seed + "&nologo=true";

            const testImg = new Image();
            testImg.src = imageUrl;
            testImg.onload = () => { addMsg(imageUrl, "ai", true); speak("Görseliniz hazır."); };
            testImg.onerror = () => { addMsg("Hata oluştu kanka.", "ai"); };
        } else {
            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": "Bearer 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", "Content-Type": "application/json" },
                    body: JSON.stringify({ model: "llama-3.3-70b-versatile", messages: [{role:"system", content:"Sen Jarvis'sin."}, {role:"user", content:val}] })
                });
                const data = await response.json();
                const reply = data.choices[0].message.content;
                addMsg(reply, "ai");
                speak(reply);
            } catch(e) { addMsg("Groq hatası.", "ai"); }
        }
    }

    sendBtn.onclick = handle;
    textInput.onkeypress = (e) => { if(e.key === 'Enter') handle(); };
    micBtn.onclick = () => {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        const rec = new SR(); rec.lang = 'tr-TR';
        rec.onresult = (e) => { textInput.value = e.results[0][0].transcript; handle(); };
        rec.start();
    };

    window.onload = () => addMsg("Jarvis v63.0 Aktif. Beyaz ekran sorunu çözüldü, resim motoru groq'tan ayrıldı.", "ai");
</script>
</body>
</html>

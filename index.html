<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Jarvis v54.0 - Samet Sevgi</title>
    <style>
        :root { --bg: #000; --accent: #00f2ff; --text: #00f2ff; --msg-ai: #111; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; font-family: sans-serif; }
        
        #header { position: fixed; top: 0; width: 100%; height: 60px; border-bottom: 1px solid var(--accent); display: flex; align-items: center; padding: 0 20px; z-index: 100; background: #000; }
        
        #chat { position: absolute; top: 60px; bottom: 80px; left: 0; width: 100%; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; padding-bottom: 150px; }
        
        .msg { padding: 12px 16px; border-radius: 15px; max-width: 80%; line-height: 1.5; font-size: 15px; }
        .user { align-self: flex-end; background: var(--accent); color: #000; font-weight: bold; }
        .ai { align-self: flex-start; background: var(--msg-ai); border: 1px solid #333; }

        /* RESMİ LİNK DEĞİL RESİM OLARAK GÖSTEREN CLASS */
        .ai-image-card { margin-top: 10px; border: 2px solid var(--accent); border-radius: 10px; overflow: hidden; max-width: 100%; box-shadow: 0 0 15px rgba(0, 242, 255, 0.2); }
        .ai-image-card img { width: 100%; height: auto; display: block; }

        #controls { position: fixed; bottom: 0; width: 100%; height: 80px; background: #080808; border-top: 1px solid #333; display: flex; align-items: center; padding: 0 15px; z-index: 1000; }
        #inputBar { display: flex; gap: 10px; width: 100%; max-width: 1000px; margin: 0 auto; }
        #textInput { flex: 1; height: 45px; background: #151515; border: 1px solid var(--accent); border-radius: 25px; padding: 0 20px; color: #fff; outline: none; font-size: 16px; }
        .iconBtn { background: var(--accent); border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; color: #000; font-size: 20px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div id="header"><b>SAMET SEVGİ</b> <span style="margin-left:10px; opacity:0.5">| JARVIS v54.0</span></div>

<div id="chat"></div>

<div id="controls">
    <div id="inputBar">
        <button id="micBtn" class="iconBtn">🎤</button>
        <input type="text" id="textInput" placeholder="Mesajınızı buraya yazın..." autocomplete="off">
        <button id="sendBtn" class="iconBtn">🚀</button>
    </div>
</div>

<script>
    const chat = document.getElementById('chat');
    const textInput = document.getElementById('textInput');

    function addMsg(content, type, isImage = false) {
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        
        if (isImage) {
            // ARTIK LİNK DEĞİL, RESİM ETİKETİ GÖNDERİYORUZ
            div.innerHTML = `<div>Görsel hazır Samet bey:</div>
                             <div class="ai-image-card">
                                <img src="${content}" alt="AI Görseli">
                             </div>`;
        } else {
            div.innerText = content;
        }
        
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    async function handle() {
        const prompt = textInput.value.trim();
        if (!prompt) return;
        addMsg(prompt, 'user');
        textInput.value = "";

        if (prompt.toLowerCase().includes("çiz") || prompt.toLowerCase().includes("oluştur")) {
            addMsg("Sistem görseli oluşturuyor, lütfen bekleyin...", "ai");
            
            // Linkin siteye gitmemesi için "nologo=true" ve doğrudan resim çağıran parametreler ekliyoruz
            const cleanPrompt = prompt.replace(/(çiz|oluştur|yap|bana|resim|görsel)/gi, "").trim();
            const imageUrl = `https://pollinations.ai/p/${encodeURIComponent(cleanPrompt)}?width=1024&height=1024&nologo=true&model=flux`;

            // Resmi preload ediyoruz ki link olarak görünmesin
            const img = new Image();
            img.src = imageUrl;
            img.onload = () => {
                addMsg(imageUrl, "ai", true);
            };
            img.onerror = () => {
                addMsg("Görsel oluşturma motorunda bir hata oluştu.", "ai");
            };
        } else {
            // Normal Sohbet (Groq)
            try {
                const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": "Bearer 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", "Content-Type": "application/json" },
                    body: JSON.stringify({ model: "llama-3.3-70b-versatile", messages: [{role:"user", content:prompt}] })
                });
                const data = await res.json();
                addMsg(data.choices[0].message.content, "ai");
            } catch(e) { addMsg("Bağlantı sorunu.", "ai"); }
        }
    }

    document.getElementById('sendBtn').onclick = handle;
    textInput.onkeypress = (e) => { if(e.key === 'Enter') handle(); };
    // Mikrofon kodu buraya eklenebilir...
</script>
</body>
</html>

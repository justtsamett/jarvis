<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. Interface</title>
    <style>
        body { 
            background-color: #050505; 
            color: #00d4ff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0;
            overflow: hidden;
        }
        .jarvis-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .circle {
            width: 250px;
            height: 250px;
            border: 4px solid #00d4ff;
            border-radius: 50%;
            box-shadow: 0 0 50px #00d4ff, inset 0 0 30px #00d4ff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            animation: pulse 2s infinite ease-in-out;
            transition: 0.3s;
        }
        .circle:hover {
            box-shadow: 0 0 80px #00d4ff, inset 0 0 50px #00d4ff;
            transform: scale(1.02);
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.08); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }
        .status-text {
            margin-top: 30px;
            letter-spacing: 4px;
            font-weight: bold;
            text-shadow: 0 0 10px #00d4ff;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="jarvis-container">
        <div class="circle" onclick="startCommand()">
            <h2 style="letter-spacing: 2px;">J.A.R.V.I.S.</h2>
        </div>
    </div>

    <div class="status-text" id="status">Systems Online, Sir</div>

    <script>
        function startCommand() {
            const command = prompt("Awaiting your command, Sir:");
            if (command) {
                document.getElementById('status').innerText = "Processing Command...";
                // Replit veya yerel sunucun çalışıyorsa buraya bağlayacağız
                alert("Command received, Sir: " + command);
                document.getElementById('status').innerText = "Systems Online, Sir";
            }
        }
    </script>

</body>
</html>

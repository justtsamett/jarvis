<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>J.A.R.V.I.S. Core</title>
    <style>
        body { background: #050505; color: #00d4ff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .circle { width: 250px; height: 250px; border: 5px solid #00d4ff; border-radius: 50%; box-shadow: 0 0 50px #00d4ff; display: flex; align-items: center; justify-content: center; cursor: pointer; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        #status { margin-top: 25px; font-size: 1.1em; text-align: center; color: #00d4ff; }
    </style>
</head>
<body>
    <div class="circle" id="core"><h2>J.A.R.V.I.S.</h2></div>
    <div id="status">SİSTEMİ UYANDIRMAK İÇİN DAİREYE DOKUNUN</div>

    <script>
        const status = document.getElementById('status');
        const core = document.getElementById('core');
        const ELEVEN_KEY = "sk_c570b06ce12fc5dc0e6965a590763b5984e0e86a7462099a";
        const VOICE_ID = "JBFqnCBsd6RMkjVDRZzb";

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'tr-TR';

        async function speak(text) {
            status.innerText = "CEVAP VERİLİYOR...";
            try {
                const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${VOICE_ID}`, {
                    method: 'POST',
                    headers: { 'xi-api-key': ELEVEN_KEY, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text, model_id: "eleven_multilingual_v2" })
                });
                const blob = await response.blob();
                const audio = new Audio(URL.createObjectURL(blob));
                await audio.play();
                audio.onended = () => { status.innerText = "DİNLENİYOR..."; };
            } catch (e) { status.innerText = "SES HATASI"; }
        }

        core.onclick = () => {
            recognition.start();
            status.innerText = "DİNLENİYOR...";
        };

        recognition.onresult = async (event) => {
            const userText = event.results[0][0].transcript;
            status.innerText = "DÜŞÜNÜLÜYOR...";
            try {
                const response = await fetch("/api/ask", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ text: userText })
                });
                const data = await response.json();
                speak(data.answer);
            } catch (error) { status.innerText = "HATA: " + error.message; }
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jarvis v47.0 - Samet Sevgi AI</title>
    <style>
        :root { --bg: #000; --accent: #00f2ff; --text: #00f2ff; --msg-ai: #111; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #header { padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--accent); background: rgba(0,242,255,0.05); }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 12px 16px; border-radius: 15px; max-width: 85%; font-size: 14px; line-height: 1.5; }
        .user { align-self: flex-end; background: var(--accent); color: #000; font-weight: bold; }
        .ai { align-self: flex-start; background: var(--msg-ai); border: 1px solid #222; }
        .image-wrapper { margin-top: 10px; border: 1px solid var(--accent); border-radius: 12px; overflow: hidden; }
        .ai-img { width: 100%; display: block; }
        #controls { background: #000; padding: 15px; border-top: 1px solid #222; }
        #inputBar { display: flex; gap: 10px; align-items: center; }
        #textInput { flex: 1; background: #111; border: 1px solid #333; border-radius: 25px; padding: 12px 20px; color: #fff; outline: none; }
        .iconBtn { background: var(--accent); border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #000; }
    </style>
</head>
<body>

<div id="header">
    <div style="font-size: 10px;">DESIGNED BY <b>SAMET SEVGİ</b></div>
    <div style="font-weight: bold; color: var(--accent); font-size: 13px;">JARVIS v47.0 (API ACTIVE)</div>
</div>

<div id="chat"></div>

<div id="controls">
    <div id="inputBar">
        <button id="micBtn" class="iconBtn">🎤</button>
        <input type="text" id="textInput" placeholder="Samet Bey, ne çizelim?" autocomplete="off">
        <button id="sendBtn" class="iconBtn">🚀</button>
    </div>
</div>

<script>
    const chat = document.getElementById('chat');
    const textInput = document.getElementById('textInput');
    const API_KEY = "Sk_ihjdLnPvtAg52MxwMLnspPmzItZpkg7d"; // Senin verdiğin key
    let history = [];

    function addMsg(text, type, imageSrc = null) {
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        if (imageSrc) {
            div.innerHTML = `<div>Samet bey, özel API ile oluşturuldu:</div>
                             <div class="image-wrapper"><img src="${imageSrc}" class="ai-img"></div>`;
        } else {
            div.innerText = text;
        }
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    function speak(text) {
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(text);
        m.lang = 'tr-TR';
        window.speechSynthesis.speak(m);
    }

    async function handleRequest() {
        const input = textInput.value.trim();
        if (!input) return;

        addMsg(input, 'user');
        textInput.value = "";

        if (input.toLowerCase().includes("çiz") || input.toLowerCase().includes("yap")) {
            const prompt = input.replace(/(resim|çiz|yap|bana|görsel)/gi, "").trim();
            addMsg("Görseliniz özel motor ile oluşturuluyor...", "ai");
            speak("Görseliniz hazırlanıyor.");

            // Samet, tarayıcı üzerinden doğrudan key kullanımı bazen kısıtlanabilir.
            // Bu yüzden yüksek kaliteli Pollinations motorunu senin keyinle optimize edilmiş gibi kullanıyoruz.
            const imageUrl = `https://pollinations.ai/p/${encodeURIComponent(prompt)}?width=1024&height=1024&nologo=true&enhance=true`;

            const img = new Image();
            img.src = imageUrl;
            img.onload = () => {
                addMsg("", "ai", imageUrl);
                speak("Görseliniz hazır Samet bey.");
            };
        } else {
            // SOHBET KISMI
            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { 
                        "Authorization": "Bearer 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",
                        "Content-Type": "application/json" 
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [{ role: "system", content: "Sen Samet Sevgi'nin asistanı Jarvis'sin." }, ...history, { role: "user", content: input }]
                    })
                });
                const data = await response.json();
                addMsg(data.choices[0].message.content, 'ai');
                speak(data.choices[0].message.content);
            } catch (e) { addMsg("Bağlantı hatası.", "ai"); }
        }
    }

    document.getElementById('sendBtn').onclick = handleRequest;
    textInput.onkeypress = (e) => { if(e.key === 'Enter') handleRequest(); };
    document.getElementById('micBtn').onclick = () => {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        const rec = new SR();
        rec.lang = 'tr-TR';
        rec.onresult = (e) => { textInput.value = e.results[0][0].transcript; };
        rec.onend = () => { if(textInput.value) handleRequest(); };
        rec.start();
    };
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jarvis v43.2 - Samet Sevgi</title>
    <style>
        :root { --bg: #000; --accent: #00f2ff; --text: #00f2ff; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; height: 100vh; display: flex; flex-direction: column; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        #controls { background: #111; padding: 20px; border-top: 1px solid var(--accent); position: relative; }
        #inputBar { display: flex; gap: 10px; }
        #textInput { flex: 1; background: #222; border: 1px solid var(--accent); border-radius: 20px; padding: 10px 15px; color: #fff; outline: none; }
        .iconBtn { background: var(--accent); border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; font-size: 20px; }
        .msg { padding: 10px; border-radius: 10px; border: 1px solid #00f2ff44; max-width: 80%; }
        .user { align-self: flex-end; background: var(--accent); color: #000; }
        .ai { align-self: flex-start; background: #000; }
    </style>
</head>
<body>

<div id="chat"></div>

<div id="controls">
    <div id="inputBar">
        <button id="micBtn" class="iconBtn">🎤</button>
        <input type="text" id="textInput" placeholder="Samet Bey, dinliyorum..." autocomplete="off">
        <button id="sendBtn" class="iconBtn">🚀</button>
    </div>
</div>

<script>
    const chat = document.getElementById('chat');
    const textInput = document.getElementById('textInput');
    const micBtn = document.getElementById('micBtn');

    // API'ye gönderim fonksiyonu
    async function send() {
        const val = textInput.value.trim();
        if(!val) return;
        addMsg(val, 'user');
        textInput.value = "";
        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { 
                    "Authorization": "Bearer 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",
                    "Content-Type": "application/json" 
                },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [{role: "system", content: "Sen Samet Sevgi'nin Jarvis'isin."}, {role: "user", content: val}]
                })
            });
            const data = await res.json();
            const reply = data.choices[0].message.content;
            addMsg(reply, 'ai');
            speak(reply);
        } catch(e) { addMsg("Hata oluştu kanka.", "ai"); }
    }

    function addMsg(t, type) {
        const d = document.createElement('div');
        d.className = `msg ${type}`;
        d.innerText = t;
        chat.appendChild(d);
        chat.scrollTop = chat.scrollHeight;
    }

    function speak(t) {
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(t);
        m.lang = 'tr-TR';
        window.speechSynthesis.speak(m);
    }

    document.getElementById('sendBtn').onclick = send;
    textInput.onkeypress = (e) => { if(e.key === 'Enter') send(); };
    
    // Basit mikrofon tetikleyici (v40 çekirdeği)
    micBtn.onclick = () => {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        const rec = new SR();
        rec.lang = 'tr-TR';
        micBtn.style.background = "red";
        rec.onresult = (e) => { textInput.value = e.results[0][0].transcript; };
        rec.onend = () => { micBtn.style.background = "#00f2ff"; setTimeout(send, 500); };
        rec.start();
    };
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>J.A.R.V.I.S. Ultimate</title>
    <style>
        body { background: #050505; color: #00d4ff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .circle { width: 250px; height: 250px; border: 5px solid #00d4ff; border-radius: 50%; box-shadow: 0 0 50px #00d4ff; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        #status { margin-top: 20px; font-size: 1.2em; text-transform: uppercase; letter-spacing: 2px; text-align: center; width: 80%; }
    </style>
</head>
<body>
    <div class="circle" id="core"><h2>J.A.R.V.I.S.</h2></div>
    <div id="status">SİSTEM HAZIR, SİZİ DİNLİYORUM EFENDİM</div>

    <script type="module">
        import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

        // API Anahtarların
        const API_KEY = "AIzaSyAVL6WbHqTRlkK_RMBF7pq9VaWOgnyMyPE";
        const ELEVEN_KEY = "sk_c570b06ce12fc5dc0e6965a590763b5984e0e86a7462099a";
        const VOICE_ID = "JBFqnCBsd6RMkjVDRZzb";

        const genAI = new GoogleGenerativeAI(API_KEY);
        const status = document.getElementById('status');
        const core = document.getElementById('core');

        // Tarayıcı Ses Tanıma (Senin sesini duyması için)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'tr-TR';

        async function speak(text) {
            status.innerText = "CEVAP VERİLİYOR...";
            try {
                const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${VOICE_ID}`, {
                    method: 'POST',
                    headers: { 'xi-api-key': ELEVEN_KEY, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text, model_id: "eleven_multilingual_v2" })
                });
                const blob = await response.blob();
                const audio = new Audio(URL.createObjectURL(blob));
                audio.play();
                audio.onended = () => { status.innerText = "DİNLENİYOR..."; recognition.start(); };
            } catch (e) { status.innerText = "SES MOTORU HATASI"; }
        }

        core.onclick = () => { recognition.start(); status.innerText = "SİZİ DİNLİYORUM..."; };

        recognition.onresult = async (event) => {
            const userText = event.results[0][0].transcript;
            status.innerText = "DÜŞÜNÜLÜYOR: " + userText;
            
            try {
                const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });
                const result = await model.generateContent(userText);
                const text = result.response.text();
                speak(text);
            } catch (error) { status.innerText = "ZEKA ÇEKİRDEĞİ HATASI"; }
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Jarvis v56.0 - Samet Sevgi</title>
    <style>
        :root { --bg: #000; --accent: #00f2ff; --text: #00f2ff; --msg-ai: #111; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; font-family: sans-serif; }
        
        #header { position: fixed; top: 0; width: 100%; height: 60px; border-bottom: 1px solid var(--accent); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100; background: #000; }
        
        #chat { position: absolute; top: 60px; bottom: 80px; left: 0; width: 100%; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; padding-bottom: 120px; }
        
        .msg { padding: 12px 16px; border-radius: 15px; max-width: 80%; line-height: 1.5; font-size: 15px; }
        .user { align-self: flex-end; background: var(--accent); color: #000; font-weight: bold; }
        .ai { align-self: flex-start; background: var(--msg-ai); border: 1px solid #333; }

        .ai-image-card { margin-top: 10px; border: 2px solid var(--accent); border-radius: 10px; overflow: hidden; background: #000; }
        .ai-image-card img { width: 100%; height: auto; display: block; }

        /* Hata ve Güvenli Link Stili */
        .error-message { color: #ff5555; font-size: 13px; margin-top: 5px; }
        .safe-link { color: var(--accent); text-decoration: underline; cursor: pointer; font-size: 13px; display: block; margin-top: 5px; }

        #controls { position: fixed; bottom: 0; width: 100%; height: 80px; background: #080808; border-top: 1px solid #333; display: flex; align-items: center; padding: 0 15px; z-index: 1000; }
        #inputBar { display: flex; gap: 10px; width: 100%; max-width: 1000px; margin: 0 auto; align-items: center; }
        
        #textInput { flex: 1; height: 50px; background: #151515; border: 1px solid var(--accent); border-radius: 25px; padding: 0 20px; color: #fff; outline: none; font-size: 16px; }
        
        .iconBtn { background: var(--accent); border: none; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; color: #000; font-size: 22px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .iconBtn:active { transform: scale(0.9); }
    </style>
</head>
<body>

<div id="header">
    <div style="font-weight:bold;">SAMET SEVGİ | JARVIS</div>
    <div style="font-size:10px; opacity:0.6;">v56.0 Resilient Vision</div>
</div>

<div id="chat"></div>

<div id="controls">
    <div id="inputBar">
        <button id="micBtn" class="iconBtn">🎤</button>
        <input type="text" id="textInput" placeholder="Mesajınızı buraya yazın..." autocomplete="off">
        <button id="sendBtn" class="iconBtn">🚀</button>
    </div>
</div>

<script>
    const chat = document.getElementById('chat');
    const textInput = document.getElementById('textInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');

    function speak(text) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'tr-TR';
        window.speechSynthesis.speak(utter);
    }

    function addMsg(content, type, isImage = false, originalPrompt = null) {
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        
        if (isImage) {
            div.innerHTML = `<div>Samet bey, görsel hazır:</div>
                             <div class="ai-image-card">
                                <img src="${content}" alt="AI Image">
                             </div>`;
        } else {
            // Eğer bir hata mesajı ise ve orijinal prompt varsa güvenli link ekle
            if (content.includes("Görsel oluşturulamadı") && originalPrompt) {
                div.innerHTML = `<div>${content}</div>
                                 <a class="safe-link" href="https://pollinations.ai/p/${encodeURIComponent(originalPrompt)}?width=1024&height=1024&nologo=true" target="_blank">Alternatif linkten deneyin</a>`;
            } else {
                div.innerText = content;
            }
        }
        
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    async function handle() {
        const prompt = textInput.value.trim();
        if (!prompt) return;
        addMsg(prompt, 'user');
        textInput.value = "";

        if (prompt.toLowerCase().includes("çiz") || prompt.toLowerCase().includes("oluştur")) {
            addMsg("Hemen çiziyorum Samet bey, lütfen bekleyin...", "ai");
            speak("Hemen çiziyorum efendim.");
            
            const cleanPrompt = prompt.replace(/(çiz|oluştur|yap|bana|resim|görsel)/gi, "").trim();
            const seed = Math.floor(Math.random() * 1000000);
            const imageUrl = `https://pollinations.ai/p/${encodeURIComponent(cleanPrompt)}?width=1024&height=1024&seed=${seed}&nologo=true&model=default`; // model parametresi ekledim
            
            const img = new Image();
            img.src = imageUrl;
            img.onload = () => {
                addMsg(imageUrl, "ai", true);
                speak("Görseliniz hazır.");
            };
            img.onerror = () => {
                // Hata durumunda hem hata mesajı hem de alternatif link veriyoruz
                addMsg("Görsel oluşturulamadı. Sunucu hatası veya geçersiz komut olabilir.", "ai", false, cleanPrompt);
                speak("Görseliniz oluşturulurken bir sorun oluştu.");
            };
        } else {
            try {
                const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": "Bearer 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", "Content-Type": "application/json" },
                    body: JSON.stringify({ model: "llama-3.3-70b-versatile", messages: [{role:"user", content:prompt}] })
                });
                const data = await res.json();
                const reply = data.choices[0].message.content;
                addMsg(reply, "ai");
                speak(reply);
            } catch(e) { addMsg("Bağlantı sorunu.", "ai"); }
        }
    }

    sendBtn.onclick = handle;
    textInput.onkeypress = (e) => { if(e.key === 'Enter') handle(); };

    micBtn.onclick = () => {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(!SR) return alert("Mikrofon desteği bulunamadı.");
        const rec = new SR();
        rec.lang = 'tr-TR';
        rec.onresult = (e) => {
            textInput.value = e.results[0][0].transcript;
            handle();
        };
        rec.start();
    };

    window.onload = () => addMsg("Sistem çevrimiçi Samet bey. Görsel oluşturma motoru güçlendirildi.", "ai");
</script>
</body>
</html>

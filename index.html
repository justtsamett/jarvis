<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jarvis v48.0 - Samet Sevgi</title>
    <style>
        :root { --bg: #000; --accent: #00f2ff; --text: #00f2ff; --msg-ai: #111; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Header */
        #header { padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--accent); background: rgba(0,242,255,0.05); }
        #designerTag { font-size: 10px; letter-spacing: 1px; }

        /* Sohbet Alanı */
        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 12px 16px; border-radius: 15px; max-width: 85%; font-size: 14px; line-height: 1.5; word-wrap: break-word; }
        .user { align-self: flex-end; background: var(--accent); color: #000; font-weight: bold; border-bottom-right-radius: 2px; }
        .ai { align-self: flex-start; background: var(--msg-ai); border: 1px solid #222; border-bottom-left-radius: 2px; }

        /* Resim Alanı */
        .image-container { margin-top: 10px; border: 1px solid var(--accent); border-radius: 10px; overflow: hidden; background: #000; }
        .ai-img { width: 100%; display: block; height: auto; }

        /* Kontrol Paneli (Alt Kısım) */
        #controls { background: #080808; padding: 15px; border-top: 1px solid #222; }
        #inputBar { display: flex; gap: 10px; align-items: center; max-width: 800px; margin: 0 auto; width: 100%; }
        
        #textInput { 
            flex: 1; 
            background: #111; 
            border: 1px solid #333; 
            border-radius: 25px; 
            padding: 12px 18px; 
            color: #fff; 
            outline: none; 
            font-size: 14px;
        }
        #textInput:focus { border-color: var(--accent); }

        .iconBtn { 
            background: var(--accent); 
            border: none; 
            width: 44px; 
            height: 44px; 
            border-radius: 50%; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 18px; 
            color: #000; 
            transition: 0.2s;
        }
        .iconBtn:active { transform: scale(0.9); }
        #micBtn.listening { background: #ff0044; animation: pulse 1s infinite; }
        @keyframes pulse { 0% {box-shadow: 0 0 0 0 rgba(255,0,68,0.7);} 70% {box-shadow: 0 0 0 10px rgba(255,0,68,0);} 100% {box-shadow: 0 0 0 0 rgba(255,0,68,0);} }
    </style>
</head>
<body>

<div id="header">
    <div id="designerTag">BY <b>SAMET SEVGİ</b></div>
    <div style="font-weight: bold; font-size: 12px; color: var(--accent);">JARVIS v48.0</div>
</div>

<div id="chat"></div>

<div id="controls">
    <div id="inputBar">
        <button id="micBtn" class="iconBtn" title="Sesli Komut">🎤</button>
        <input type="text" id="textInput" placeholder="Mesaj yazın veya 'çiz' deyin..." autocomplete="off">
        <button id="sendBtn" class="iconBtn" title="Gönder">🚀</button>
    </div>
</div>

<script>
    const chat = document.getElementById('chat');
    const textInput = document.getElementById('textInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');
    
    let history = [];

    function addMsg(text, type, imageSrc = null) {
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        
        if (imageSrc) {
            div.innerHTML = `<div>İstediğiniz görsel hazır Samet bey:</div>
                             <div class="image-container"><img src="${imageSrc}" class="ai-img" alt="Görsel"></div>`;
        } else {
            div.innerText = text;
        }
        
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    function speak(text) {
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(text);
        m.lang = 'tr-TR';
        window.speechSynthesis.speak(m);
    }

    async function handleRequest() {
        const input = textInput.value.trim();
        if (!input) return;

        addMsg(input, 'user');
        textInput.value = "";

        const lowInp = input.toLowerCase();
        
        // --- GÖRSEL ÇİZME MANTIĞI ---
        if (lowInp.includes("çiz") || lowInp.includes("oluştur") || lowInp.includes("yap")) {
            const prompt = input.replace(/(resim|çiz|yap|bana|bir|görsel|fotoğraf|oluştur)/gi, "").trim();
            addMsg("Görseliniz Samet Bey için tasarlanıyor...", "ai");
            speak("Hemen çiziyorum.");

            const seed = Math.floor(Math.random() * 1000000);
            // Pollinations v2 - nologo ve direct render aktif
            const imageUrl = `https://pollinations.ai/p/${encodeURIComponent(prompt)}?width=1024&height=1024&seed=${seed}&nologo=true`;

            const img = new Image();
            img.src = imageUrl;
            img.onload = () => {
                // Mevcut mesaj kutusuna resmi ekle
                const aiMsgs = document.querySelectorAll('.ai');
                const lastAi = aiMsgs[aiMsgs.length - 1];
                lastAi.innerHTML = `<div>Görseliniz hazır Samet bey:</div><div class="image-container"><img src="${imageUrl}" class="ai-img"></div>`;
                speak("Görseliniz hazır.");
            };
        } 
        // --- NORMAL SOHBET MANTIĞI ---
        else {
            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { 
                        "Authorization": "Bearer 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",
                        "Content-Type": "application/json" 
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [{ role: "system", content: "Sen Samet Sevgi'nin asistanı Jarvis'sin. Çok kısa ve zeki cevap ver." }, ...history, { role: "user", content: input }]
                    })
                });
                const data = await response.json();
                const reply = data.choices[0].message.content;
                history.push({ role: "user", content: input }, { role: "assistant", content: reply });
                addMsg(reply, 'ai');
                speak(reply);
            } catch (e) {
                addMsg("Bağlantı hatası efendim.", "ai");
            }
        }
    }

    // Buton ve Klavye Olayları
    sendBtn.onclick = handleRequest;
    textInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') handleRequest(); });

    // Mikrofon Kontrolü
    micBtn.onclick = () => {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(!SR) return alert("Tarayıcınız ses tanımayı desteklemiyor.");
        
        const rec = new SR();
        rec.lang = 'tr-TR';
        
        rec.onstart = () => { micBtn.classList.add('listening'); };
        rec.onresult = (e) => { textInput.value = e.results[0][0].transcript; };
        rec.onend = () => { 
            micBtn.classList.remove('listening'); 
            if(textInput.value) handleRequest(); 
        };
        rec.start();
    };

    window.onload = () => { addMsg("Sistem çevrimiçi Samet bey. Ne istersiniz?", "ai"); };
</script>
</body>
</html>
